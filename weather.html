<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космическая Погода</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#000;color:#fff;min-height:100vh;overflow-x:hidden;position:relative}
.stars,.precip,.fog{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#4db8ff;border-radius:50%;opacity:.7;animation:float linear infinite}
@keyframes float{0%{transform:translateY(-10px);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(100vh) translateX(30px);opacity:0}}
.drop{position:absolute;width:2px;height:14px;background:linear-gradient(to bottom,transparent,#4db8ff);animation:rain linear infinite}
@keyframes rain{0%{transform:translateY(-20px);opacity:0}10%{opacity:.7}100%{transform:translateY(100vh);opacity:0}}
.flake{position:absolute;color:#fff;font-size:12px;animation:snow linear infinite}
@keyframes snow{0%{transform:translateY(-20px) translateX(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(100vh) translateX(40px) rotate(360deg);opacity:.3}}
.fog-layer{position:absolute;width:200%;height:100%;background:radial-gradient(ellipse at center,rgba(200,210,220,.6) 0%,rgba(150,160,170,.3) 40%,transparent 70%);filter:blur(40px)}
.fog-1{animation:fogMove1 25s ease-in-out infinite alternate}
.fog-2{animation:fogMove2 35s ease-in-out infinite alternate;opacity:.6}
@keyframes fogMove1{0%{transform:translateX(-30%)}100%{transform:translateX(10%)}}
@keyframes fogMove2{0%{transform:translateX(10%)}100%{transform:translateX(-30%)}}
.container{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:40px 20px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lang-toggle{background:rgba(0,30,60,.6);border:1px solid #1a5fa8;border-radius:20px;padding:6px 14px;color:#4db8ff;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .3s}
.lang-toggle:hover{background:rgba(77,184,255,.15);box-shadow:0 0 10px rgba(77,184,255,.3)}
h1{text-align:center;font-size:3rem;color:#4db8ff;margin-bottom:24px;text-shadow:0 0 20px rgba(77,184,255,.5)}
.search-box{background:rgba(0,20,40,.6);border:1px solid #1a5fa8;border-radius:12px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px)}
input[type="text"]{width:100%;padding:16px 20px;background:rgba(0,0,0,.5);border:1px solid #1a5fa8;border-radius:10px;color:#fff;font-size:1.1rem;margin-bottom:14px;outline:none;transition:border-color .3s}
input[type="text"]:focus{border-color:#4db8ff;box-shadow:0 0 10px rgba(77,184,255,.3)}
input::placeholder{color:#6688aa}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0066ff,#0088ff);border:none;border-radius:10px;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:all .3s;margin-bottom:10px}
.btn:hover{transform:scale(1.02);box-shadow:0 0 25px rgba(0,102,255,.5)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-geo{background:linear-gradient(135deg,#0088ff,#00aaff);font-size:1rem;padding:12px}
.result{margin-top:24px;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.city-title{text-align:center;font-size:1.8rem;color:#4db8ff;margin-bottom:20px}
.current{text-align:center;margin-bottom:24px}
.weather-icon{font-size:3.5rem;margin-bottom:8px;filter:drop-shadow(0 0 15px rgba(77,184,255,.4))}
.current-temp{font-size:3rem;font-weight:700;margin-bottom:6px}
.current-feels{font-size:1rem;color:#aaccff;margin-bottom:14px}
.extra-stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:rgba(0,30,60,.5);border:1px solid #1a5fa8;border-radius:10px;padding:10px 16px;min-width:100px}
.stat-label{font-size:.75rem;color:#6688aa;margin-bottom:4px}
.stat-value{font-size:1.1rem;font-weight:700;color:#4db8ff}
.forecast-title{text-align:center;font-size:1.4rem;color:#4db8ff;margin:24px 0 16px}
.forecast-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.forecast-scroll::-webkit-scrollbar{height:4px}
.forecast-scroll::-webkit-scrollbar-thumb{background:#1a5fa8;border-radius:2px}
.day-card{min-width:110px;background:rgba(0,30,60,.6);border:1px solid #1a5fa8;border-radius:12px;padding:16px 12px;text-align:center;flex-shrink:0;backdrop-filter:blur(5px);cursor:pointer;transition:all .3s}
.day-card:hover{border-color:#4db8ff;transform:translateY(-3px)}
.day-card.active{border-color:#4db8ff;background:rgba(77,184,255,.15);box-shadow:0 0 15px rgba(77,184,255,.3)}
.day-name{font-size:1rem;color:#4db8ff;margin-bottom:6px}
.day-icon{font-size:1.8rem;margin-bottom:6px}
.day-temp{font-size:1.1rem;font-weight:700}
.hourly-section{max-height:0;overflow:hidden;opacity:0;transition:max-height 0.6s ease-out, opacity 0.6s ease-out, margin 0.6s;margin-top:0}
.hourly-section.open{max-height:400px;opacity:1;margin-top:24px}
.hourly-title{text-align:center;font-size:1.2rem;color:#4db8ff;margin-bottom:12px}
.hourly-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.hourly-scroll::-webkit-scrollbar{height:4px}
.hourly-scroll::-webkit-scrollbar-thumb{background:#1a5fa8;border-radius:2px}
.hour-item{min-width:80px;background:rgba(0,20,40,.8);border:1px solid #1a5fa8;border-radius:10px;padding:10px 8px;text-align:center;flex-shrink:0}
.hour-time{font-size:.85rem;color:#aaccff;margin-bottom:4px}
.hour-icon{font-size:1.4rem;margin-bottom:4px}
.hour-temp{font-size:1rem;font-weight:700}
.error,.loading{text-align:center;color:#ff6688;font-size:1rem;margin-top:16px}
.loading{color:#4db8ff}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="fog"><div class="fog-layer fog-1"></div><div class="fog-layer fog-2"></div></div>
<div class="precip" id="precip"></div>
<div class="container">
<div class="top-bar"><span></span><button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button></div>
<h1 id="title">Погода</h1>
<div class="search-box">
<input type="text" id="cityInput" placeholder="Город (Москва / London)" autocomplete="off">
<button class="btn" id="searchBtn" onclick="getWeather()">Узнать погоду</button>
<button class="btn btn-geo" id="geoBtn" onclick="geoLocate()">📍 Моё местоположение</button>
</div>
<div id="result"></div>
</div>

<script>
const I18N={ru:{title:'Погода',ph:'Город (Москва / London)',btn:'Узнать погоду',geo:'📍 Моё местоположение',now:'Сейчас',feels:'Ощущается',wind:'Ветер',hum:'Влажность',press:'Давление',week:'Прогноз на неделю',today:'Сегодня',hourly:'Погода по часам: ',notfound:'❌ Город не найден.',err:'❌ Ошибка загрузки.',loading:'Ищем город...',geoErr:'❌ Не удалось определить местоположение.',geoDenied:'❌ Доступ к геолокации запрещён.',days:['Вс','Пн','Вт','Ср','Чт','Пт','Сб']},en:{title:'Weather',ph:'City (Moscow / London)',btn:'Get weather',geo:'📍 My location',now:'Now',feels:'Feels like',wind:'Wind',hum:'Humidity',press:'Pressure',week:'Weekly forecast',today:'Today',hourly:'Hourly forecast: ',notfound:'❌ City not found.',err:'❌ Load error.',loading:'Searching...',geoErr:'❌ Could not determine location.',geoDenied:'❌ Geolocation access denied.',days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']}};
const ICONS={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
let lang='ru', currentWeatherData=null;

function t(){return I18N[lang]}
function applyLang(){document.getElementById('title').textContent=t().title;document.getElementById('cityInput').placeholder=t().ph;document.getElementById('searchBtn').textContent=t().btn;document.getElementById('geoBtn').textContent=t().geo}
function toggleLang(){lang=lang==='ru'?'en':'ru';document.getElementById('langBtn').textContent=lang==='ru'?'EN':'RU';applyLang();const c=document.getElementById('cityInput').value.trim();if(c&&currentWeatherData)renderWeather(currentWeatherData, c)}
function createStars(){const c=document.getElementById('stars');for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*6+2;s.style.width=sz+'px';s.style.height=sz+'px';s.style.left=Math.random()*100+'%';s.style.animationDuration=(Math.random()*15+10)+'s';s.style.animationDelay=(Math.random()*10)+'s';c.appendChild(s)}}
createStars();

function setPrecip(code){const p=document.getElementById('precip');p.innerHTML='';if(!code)return;
if([61,63,65,80,81,82,95,96,99,51,53,55].includes(code)){for(let i=0;i<50;i++){const d=document.createElement('div');d.className='drop';d.style.left=Math.random()*100+'%';d.style.animationDuration=(Math.random()*1+0.5)+'s';d.style.animationDelay=(Math.random()*2)+'s';p.appendChild(d)}}
else if([71,73,75,77,85,86].includes(code)){for(let i=0;i<30;i++){const f=document.createElement('div');f.className='flake';f.textContent='❄';f.style.left=Math.random()*100+'%';f.style.fontSize=(Math.random()*10+8)+'px';f.style.animationDuration=(Math.random()*8+6)+'s';f.style.animationDelay=(Math.random()*5)+'s';p.appendChild(f)}}}

document.getElementById('cityInput').addEventListener('keypress',e=>{if(e.key==='Enter')getWeather()});

async function geoLocate(){
const r=document.getElementById('result'), btn=document.getElementById('geoBtn');
btn.disabled=true; btn.textContent='⏳ ...'; r.innerHTML='<div class="loading">'+t().loading+'</div>';
if(!navigator.geolocation){r.innerHTML='<div class="error">'+t().geoErr+'</div>';btn.disabled=false;btn.textContent=t().geo;return}
navigator.geolocation.getCurrentPosition(async pos=>{
try{
const{latitude:la,longitude:lo}=pos.coords;
const gRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=&count=1&language=${lang}&format=json&latitude=${la}&longitude=${lo}`);
const gData=await gRes.json();
let cityName=lang==='ru'?'Моё местоположение':'My Location';
if(gData.results&&gData.results.length>0) cityName=gData.results[0].name;
fetchWeather(cityName,la,lo);
}catch(e){r.innerHTML='<div class="error">'+t().geoErr+'</div>'}
btn.disabled=false; btn.textContent=t().geo;
},err=>{r.innerHTML='<div class="error">'+(err.code===1?t().geoDenied:t().geoErr)+'</div>';btn.disabled=false;btn.textContent=t().geo},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

function getWeather(){const c=document.getElementById('cityInput').value.trim();if(c)fetchWeather(c)}

async function fetchWeather(city,la,lo){
const r=document.getElementById('result'), btn=document.getElementById('searchBtn');
btn.disabled=true; r.innerHTML='<div class="loading">'+t().loading+'</div>';
try{
if(la===undefined){
const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=${lang}&format=json`)).json();
if(!g.results||!g.results.length){r.innerHTML='<div class="error">'+t().notfound+'</div>';btn.disabled=false;return}
la=g.results[0].latitude; lo=g.results[0].longitude; city=g.results[0].name;
}
const w=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7`)).json();
currentWeatherData={city, weather:w};
renderWeather(currentWeatherData, city);
}catch(e){r.innerHTML='<div class="error">'+t().err+'</div>'}
btn.disabled=false;
}

function renderWeather(data, city){
const w=data.weather, c=w.current, d=w.daily;
setPrecip(c.weather_code);
let h='<div class="result"><div class="city-title">'+t().title+' в '+city+'</div><div class="current"><div class="weather-icon">'+(ICONS[c.weather_code]||'🌡️')+'</div><div class="current-temp">'+t().now+': '+c.temperature_2m+'°C</div><div class="current-feels">'+t().feels+': '+c.apparent_temperature+'°C</div><div class="extra-stats"><div class="stat"><div class="stat-label">'+t().wind+'</div><div class="stat-value">'+c.wind_speed_10m+' км/ч</div></div><div class="stat"><div class="stat-label">'+t().hum+'</div><div class="stat-value">'+c.relative_humidity_2m+'%</div></div><div class="stat"><div class="stat-label">'+t().press+'</div><div class="stat-value">'+Math.round(c.surface_pressure*0.75006)+' мм</div></div></div></div><div class="forecast-title">'+t().week+'</div><div class="forecast-scroll" id="forecastScroll">';
for(let i=0;i<d.time.length;i++){
const dt=new Date(d.time[i]);
const dn=i===0?t().today:t().days[dt.getDay()];
h+='<div class="day-card" onclick="toggleHourly(\''+d.time[i]+'\', \''+dn+'\')"><div class="day-name">'+dn+'</div><div class="day-icon">'+(ICONS[d.weather_code[i]]||'🌡️')+'</div><div class="day-temp">'+Math.round(d.temperature_2m_max[i])+'° / '+Math.round(d.temperature_2m_min[i])+'°</div></div>';
}
h+='</div><div class="hourly-section" id="hourlySection"><div class="hourly-title" id="hourlyTitle"></div><div class="hourly-scroll" id="hourlyScroll"></div></div></div>';
document.getElementById('result').innerHTML=h;
}

function toggleHourly(dateStr, dayName){
const section=document.getElementById('hourlySection');
const title=document.getElementById('hourlyTitle');
const scroll=document.getElementById('hourlyScroll');
const cards=document.querySelectorAll('.day-card');

if(section.classList.contains('open') && title.textContent.includes(dayName)){
section.classList.remove('open');
cards.forEach(c=>c.classList.remove('active'));
return;
}

cards.forEach(c=>c.classList.remove('active'));
event.currentTarget.classList.add('active');

title.textContent=t().hourly+dayName;
const hourlyTimes=currentWeatherData.weather.hourly.time;
const hourlyTemps=currentWeatherData.weather.hourly.temperature_2m;
const hourlyCodes=currentWeatherData.weather.hourly.weather_code;

let html='';
for(let i=0;i<hourlyTimes.length;i++){
if(hourlyTimes[i].startsWith(dateStr)){
const time=hourlyTimes[i].split('T')[1];
const temp=Math.round(hourlyTemps[i]);
const icon=ICONS[hourlyCodes[i]]||'🌡️';
html+='<div class="hour-item"><div class="hour-time">'+time+'</div><div class="hour-icon">'+icon+'</div><div class="hour-temp">'+temp+'°</div></div>';
}
}
scroll.innerHTML=html;
section.classList.add('open');
}

applyLang();
</script>
</body>
</html>
